services:
  db:
    image: postgres:17-alpine
    container_name: climbcheck-db
    environment:
      POSTGRES_DB: lp_leaderboard
      POSTGRES_USER: lp_user
      POSTGRES_PASSWORD: lp_password
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lp_user -d lp_leaderboard"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  db-data:
